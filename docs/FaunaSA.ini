; FaunaSA - configuracao (copie para a pasta do jogo, ao lado do gta_sa.exe)
;
; [AnimGroups]: grupo de animacao para animais cuja pasta nao traz .ifp proprio.
;   <pasta do animal>=<grupo>   grupos disponiveis: Boar, rabit, deer1, lion, wolf, bear, dog, cat
;   <pasta do animal>=none      usa a animacao de humano do jogo (padrao de vaca, raposa, capivara, gorila, pato e galinha)
; Os padroes abaixo vem da comparacao de esqueleto/pose (docs/ESQUELETOS.md). Teste e ajuste a gosto.
[AnimGroups]
Anim7=Boar
Anim92=Boar

; [Horse]: cavalo cavalgavel (adaptacao do New Horse Mod de nadalao). Enabled=0 desliga.
[Horse]
Enabled=1
; AimLimit (EXPERIMENTAL): abertura total da mira montado, em graus, para a frente do cavalo (150 = 75 para cada lado). 0 (padrao) = nao mexe
; na camera. Ligado, a camera e reposicionada depois do calculo da mira do jogo e o braco do CJ pode apontar para o lado.
AimLimit=0
; AlignGun: 1 (padrao) gira so o desenho do corpo para o cano da arma coincidir com a mira (compatibilidade com mods de animacao de arma,
; como Enhanced Pistol/Shotgun/Rifle Animation, cujos tiros apontam para o lado). 0 desliga.
AlignGun=1
